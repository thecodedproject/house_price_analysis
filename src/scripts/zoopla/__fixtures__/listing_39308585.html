<script>self.__next_f.push([1,"9b:T66d,A very spacious 2 double bedroom apartment for sale, of approx. 1355sq.ft (126sq.m) on the 2nd floor (with lift) of this small secure development located in Westminster within walking distance to the River Thames, the Houses of Parliament and Buckingham Palace. This property is proportionally one of the biggest of its type in the area and further benefits from a large dual aspect reception room, a separate integrated kitchen and breakfast room, good storage including built in wardrobes to both bedrooms and there are 2 bathrooms (1 en-suite). This apartment does need modernising throughout but provides a great opportunity for an investor or pied a terre buyer to put their own stamp on an unusually large modern apartment in a great location. In our opinion there is scope to easily convert this into a 3 bedroom apartment, if so desired. 42 Great Smith Street sits at the junction with Marsham Street and Great Smith Street and as such, is extremely well located to the transport links of St James's Park, Westminster and Victoria which are all within walking distance and the surrounding area also offers a variety of retail stores, including the flagship House of Fraser Department store, the Cardinal Place Shopping Centre as well as an abundance of amenities including a Tesco Local, a Little Waitrose, a Curzon Cinema and many new restaurants, namely, Jamie Oliver’s Italian, Iberica, Browns, La Tasca, Zizzi and Wagamama to name but a few. Shepherds, The Quilon and Cinnamon Club compliment the extensive range of existing restaurants.\u003cbr>\u003cbr>Lease: 99 Years From March 1982\u003cbr>Service Charge: £2817.48pa\u003cbr>Ground Rent: £250pa"])</script>
